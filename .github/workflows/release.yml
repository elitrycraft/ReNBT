name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия релиза (например, v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ inputs.version }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: mcpack-build

      - name: List files
        run: ls -la

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OpenDeep
        run: pip install -e .[cf]

      - name: Save commits to file
        run: git log -30 --pretty=format:"- %s" > commits.txt

      - name: Save file tree to file
        run: |
          {
            echo "=== Структура репозитория ==="
            find . -type f \
              -not -path "./.git/*" \
              -not -path "./venv/*" \
              -not -path "./__pycache__/*" \
              -not -path "./*.egg-info/*" \
              | sort
          } > files.txt
          echo "=== Содержимое ключевых файлов ===" >> files.txt
          for f in README.md pyproject.toml MANIFEST.in .gitignore; do
            if [ -f "$f" ]; then
              echo "" >> files.txt
              echo "----- $f -----" >> files.txt
              head -c 3000 "$f" >> files.txt
              echo "" >> files.txt
            fi
          done
          echo "" >> files.txt
          echo "=== Python-модули ===" >> files.txt
          find . -name "*.py" -not -path "./.git/*" -not -path "./venv/*" | sort >> files.txt

      - name: Generate release notes with DeepSeek
        id: ai
        env:
          DEEPSEEK_TOKEN: ${{ secrets.DEEPSEEK_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: python .github/scripts/gen_release_notes.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: OpenDeep ${{ inputs.version }}
          body_path: release_notes.md
          files: "*.mcpack"
          draft: false
          prerelease: false
