name: Build MCPack

on:
  workflow_call:                 # вызывается из release.yml
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:             # и вручную тоже можно
    inputs:
      version:
        description: 'Версия (например, v1.0.0)'
        required: false
        default: 'dev'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pack_name: ${{ steps.pack.outputs.pack_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show files (debug)
        run: ls -la

      - name: Create zip archive
        run: |
          zip -r pack.zip . \
            -x ".git/*" ".github/*" "*.zip" "*.mcpack" "venv/*" "__pycache__/*" "*.pyc"

      - name: Rename to .mcpack
        id: pack
        run: |
          VERSION="${{ inputs.version }}"
          # Если версия пустая — берём дату и SHA
          if [ -z "$VERSION" ] || [ "$VERSION" = "dev" ]; then
            VERSION="v$(date +'%Y.%m.%d')-${GITHUB_SHA::7}"
          fi
          PACK_NAME="OpenDeep-${VERSION}.mcpack"
          mv pack.zip "$PACK_NAME"
          echo "pack_name=$PACK_NAME" >> $GITHUB_OUTPUT
          echo "Создан файл: $PACK_NAME"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcpack-build
          path: ${{ steps.pack.outputs.pack_name }}
          retention-days: 30
